services:
  postgres:
    image: postgres:16
    container_name: politica-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: politics_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # redis:   # futuro (BullMQ)
  #   image: redis:7

volumes:
  pgdata:
